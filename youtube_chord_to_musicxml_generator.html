<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Chord to MusicXML Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- モックデータ（デモ用のコード進行） ---
        const MOCK_DATA = {
            "HJctOrk7L14": {
                title: "キセキ",
                artist: "植村花菜",
                sections: [
                    { name: "Intro", bars: 4, chords: ["C△7", "G/B", "Am7", "C/G", "F△7", "C/E", "Dm7", "G"] },
                    { name: "A", bars: 8, chords: ["C", "G/B", "Am7", "C/G", "F△7", "C/E", "Dm7", "G", "C", "G/B", "Am7", "C/G", "F△7", "C/E", "Dm7", "G"] },
                    { name: "B", bars: 4, chords: ["F△7", "G", "Em7", "Am7", "Dm7", "C/E", "F△7", "Gsus4"] },
                    { name: "Chorus", bars: 8, chords: ["C", "G/B", "Am7", "C/G", "F△7", "C/E", "Dm7", "G", "C", "G/B", "Am7", "C/G", "F△7", "C/E", "Dm7", "G"] },
                    { name: "Outro", bars: 4, chords: ["F△7", "Em7", "Dm7", "G", "C△7", "C△7", "C△7", "C△7"] }
                ]
            },
            "default": {
                title: "Sample Song (未登録のURL)",
                artist: "Unknown",
                sections: [
                    { name: "A", bars: 4, chords: ["C△7", "Am7", "Dm7", "G7"] },
                    { name: "B", bars: 4, chords: ["F△7", "Em7", "Dm7", "C△7"] }
                ]
            }
        };

        // --- MusicXML 生成ロジック（v3.0ルール厳守） ---
        const generateMusicXML = (songData) => {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n<score-partwise version="3.1">\n  <work>\n    <work-title>${songData.title}</work-title>\n  </work>\n  <identification>\n    <creator type="composer">${songData.artist}</creator>\n  </identification>\n  <part-list>\n    <score-part id="P1">\n      <part-name>Chords</part-name>\n    </score-part>\n  </part-list>\n  <part id="P1">\n`;

            let measureNumber = 1;

            songData.sections.forEach((section) => {
                for (let i = 0; i < section.bars; i++) {
                    // ルール5&6: セクション開始位置、または4小節ごとに必ず改段する
                    const isNewSystem = (i === 0 || i % 4 === 0) ? '<print new-system="yes"/>' : '';
                    
                    // 1小節につき1コード（簡易アサイン）
                    const chord = section.chords[i % section.chords.length] || "C";
                    
                    // コードのパース（ルート音、ベース音、種類）
                    let root = chord.charAt(0);
                    let kind = 'major';
                    let kindText = '';
                    let bassXML = '';
                    
                    if (chord.includes('/')) {
                        const parts = chord.split('/');
                        bassXML = `<bass><bass-step>${parts[1].charAt(0)}</bass-step></bass>`;
                    }
                    
                    // ルール13: △7の強制維持
                    if (chord.includes('△7')) {
                        kind = 'other';
                        kindText = ' text="△7"';
                    } else if (chord.includes('m7(b5)')) {
                        kind = 'half-diminished';
                    } else if (chord.includes('m7')) {
                        kind = 'minor-seventh';
                    } else if (chord.includes('sus4')) {
                        kind = 'suspended-fourth';
                    } else if (chord.includes('7')) {
                        kind = 'dominant';
                    }

                    let chordXML = `
      <harmony>
        <root><root-step>${root}</root-step></root>
        <kind${kindText}>${kind}</kind>
        ${bassXML}
      </harmony>`;

                    // 最初の小節の属性設定
                    let attributes = '';
                    if (measureNumber === 1) {
                        attributes = `
      <attributes>
        <divisions>1</divisions>
        <key><fifths>0</fifths></key>
        <time><beats>4</beats><beat-type>4</beat-type></time>
        <clef><sign>G</sign><line>2</line></clef>
      </attributes>`;
                    }

                    // ルール3: セクション名（リハーサルマーク）
                    let direction = '';
                    if (i === 0) {
                        direction = `
      <direction placement="above">
        <direction-type>
          <rehearsal>${section.name}</rehearsal>
        </direction-type>
      </direction>`;
                    }

                    // ルール7: 全休符の非表示 (print-object="no")
                    xml += `    <measure number="${measureNumber}">
      ${isNewSystem}${attributes}${direction}${chordXML}
      <note print-object="no">
        <rest/>
        <duration>4</duration>
        <voice>1</voice>
        <type>whole</type>
      </note>
    </measure>\n`;
                    measureNumber++;
                }
            });

            xml += `  </part>\n</score-partwise>`;
            return xml;
        };

        // --- React アプリコンポーネント ---
        const App = () => {
            const [url, setUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);

            const handleAnalyze = () => {
                if (!url) return alert('URLを入力してください');
                
                setLoading(true);
                setResult(null);

                // URLから動画IDを抽出
                const match = url.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/);
                const videoId = match ? match[1] : 'default';

                // APIの代わりのシミュレーション（1.5秒待機）
                setTimeout(() => {
                    const data = MOCK_DATA[videoId] ? MOCK_DATA[videoId] : MOCK_DATA['default'];
                    setResult(data);
                    setLoading(false);
                }, 1500);
            };

            const downloadXML = () => {
                if (!result) return;
                const xmlString = generateMusicXML(result);
                const blob = new Blob([xmlString], { type: 'application/vnd.recordare.musicxml+xml' });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `${result.title}.musicxml`; // MuseScoreで開ける拡張子
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            };

            return (
                <div className="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                    <h1 className="text-2xl font-bold mb-2 text-slate-800">YouTube Chord to MusicXML v3.0</h1>
                    <p className="text-sm text-gray-500 mb-6">Qiita記事のアーキテクチャをベースにした譜面化ルール厳守版ジェネレーター</p>
                    
                    <div className="flex gap-2 mb-6">
                        <input 
                            type="text" 
                            className="flex-1 border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                            placeholder="YouTubeのURLを貼り付け (例: https://www.youtube.com/watch?v=HJctOrk7L14)"
                            value={url}
                            onChange={(e) => setUrl(e.target.value)}
                        />
                        <button 
                            onClick={handleAnalyze}
                            disabled={loading}
                            className="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 disabled:opacity-50 transition"
                        >
                            {loading ? '解析中...' : '解析'}
                        </button>
                    </div>

                    {result && (
                        <div className="border-t pt-6">
                            <h2 className="text-xl font-bold mb-4">{result.title} / {result.artist}</h2>
                            <div className="bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200">
                                {result.sections.map((sec, idx) => (
                                    <div key={idx} className="mb-4 last:mb-0">
                                        <span className="inline-block bg-slate-800 text-white px-2 py-1 rounded text-xs font-bold mb-2">[{sec.name}]</span>
                                        <div className="flex flex-wrap gap-2 text-sm">
                                            {sec.chords.map((chord, i) => (
                                                <div key={i} className="w-16 h-10 flex items-center justify-center bg-white border border-gray-300 rounded">
                                                    {chord}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <button 
                                onClick={downloadXML}
                                className="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition shadow"
                            >
                                MusicXML (.musicxml) をダウンロード
                            </button>
                            <p className="text-
